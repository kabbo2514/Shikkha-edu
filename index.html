/* ---------------- practice ---------------- */
function viewPractice(chapterId) {
  if (!PRACTICE || (chapterId && PRACTICE.chapterId !== chapterId)) {
    if (!startPractice(chapterId)) return viewLearn();
  }
  if (PRACTICE.finished) return viewPracticeResult();
  const q = practiceQuestion();
  if (!q) return viewPracticeResult();
  const s = subjectOf(q.subjectId);
  const chosen = PRACTICE.chosen;
  const total = PRACTICE.queue.length;
  const answeredCount = PRACTICE.answers.length;
  const secs = Math.floor((Date.now() - PRACTICE.startedAt) / 1000);
  const qt = qText(q);
  const hiddenOpts = PRACTICE.hints.includes(q.id) ? qt.opts.map((o, i) => i === qt.ans ? -1 : i).filter(i => i >= 0).slice(0, 2) : [];
  return {
    active:"learn",
    title:`${t("practice")} › ${PRACTICE.title}`,
    body:`<div class="page">
      <div class="row wrap" style="gap:10px">
        <a class="btn btn-sm btn-ghost" href="#/chapter/${PRACTICE.chapterId}">${icon("arrowLeft", 14)} ${esc(t("back"))}</a>
        <div style="flex:1;min-width:140px"><div class="tiny faint">${esc(subjName(s))} · ${esc(chapName(chapterOf(PRACTICE.chapterId)))}</div>
          <div class="row" style="gap:8px;margin-top:3px"><b style="font-size:13px">${esc(PRACTICE.title)}</b><span class="tag ${PRACTICE.mode === "mistakes" ? "rose" : PRACTICE.mode === "mixed" ? "violet" : "blue"}">${PRACTICE.mode === "mistakes" ? esc(t("mistakes")) : PRACTICE.mode === "mixed" ? (DEVICE.lang === "bn" ? "মিশ্র" : "Mixed") : (DEVICE.lang === "bn" ? "অধ্যায়" : "Chapter")}</span></div></div>
        <span class="timer" style="font-size:14px" id="practiceClock">${icon("clock", 14)} <span class="num">${fmtClock(secs)}</span></span>
        <span class="tag grey">${PRACTICE.index + 1} / ${total}</span>
      </div>
      <div class="quizbar"><div class="bar"><i style="width:${(PRACTICE.index) / total * 100}%"></i></div>
        <span class="tiny faint num">${answeredCount} ${DEVICE.lang === "bn" ? "উত্তর দেওয়া" : "answered"}</span></div>

      <div class="card qcard">
        <div class="qmeta">
          <span class="tag blue">${DEVICE.lang === "bn" ? "প্রশ্ন" : "Question"} ${PRACTICE.index + 1}</span>
          ${markPill(q)}
          <span class="tag grey">${q.marks} ${DEVICE.lang === "bn" ? "নম্বর" : "mark"}</span>
          <button class="icon-btn plain" data-action="toggle-lang" aria-label="Language" style="margin-left:auto;width:32px;height:32px;flex:0 0 32px">${icon("globe", 15)}</button>
          <button class="icon-btn ${DB.bookmarks.includes(q.id) ? "" : "plain"}" data-action="bookmark-q" data-id="${q.id}" aria-label="${esc(t("bookmark"))}" style="width:32px;height:32px;flex:0 0 32px;color:${DB.bookmarks.includes(q.id) ? "var(--blue)" : "var(--muted)"}">${icon("bookmark", 15)}</button>
        </div>
        <h2 class="qtext${DEVICE.lang === "bn" ? " bn" : ""}">${esc(qt.q)}</h2>
        <div class="options">
          ${qt.opts.map((opt, i) => {
            let cls = "";
            if (PRACTICE.revealed) {
              if (i === qt.ans) cls = "correct";
              else if (i === chosen) cls = "wrong";
              else cls = "dim";
            } else if (i === chosen) cls = "selected";
            else if (hiddenOpts.includes(i)) cls = "dim";
            return `<button class="opt ${cls}" data-action="choose-opt" data-i="${i}" ${PRACTICE.revealed || hiddenOpts.includes(i) ? "disabled" : ""}>
              <span class="key">${"ABCD"[i]}</span>
              <span class="txt">${esc(opt)}</span>
              <span class="mark">${icon(PRACTICE.revealed && i === qt.ans ? "check" : "x", 18)}</span>
            </button>`;
          }).join("")}
        </div>
        ${PRACTICE.revealed ? `<div class="explain">
          <b>${icon("sparkles", 14)} ${esc(t("explanation"))}</b>
          <span>${esc(qt.exp)}</span>
          <div class="tiny faint" style="margin-top:8px">${esc(q.source || "")}</div>
        </div>` : ""}

          <button class="btn btn-ghost btn-sm" data-action="prev-q" ${PRACTICE.index === 0 ? "disabled" : ""}>${icon("arrowLeft", 14)} ${esc(t("previous"))}</button>
          ${!PRACTICE.revealed ? `<button class="btn btn-ghost btn-sm" data-action="hint" ${PRACTICE.hints.includes(q.id) ? "disabled" : ""}>${icon("sparkles", 14)} 50/50</button>` : ""}
          <div class="spacer"></div>
          ${PRACTICE.revealed
            ? `<button class="btn btn-primary" data-action="next-q">${PRACTICE.index === total - 1 ? esc(t("finish")) : esc(t("next"))} ${icon("arrowRight", 15)}</button>`

    </div>`
  };
}

          <div class="col" style="padding:14px 20px 20px">

/* ---------------- exams ---------------- */
function examPresets() {
  const u = me();
  const presets = [];
  const subjects = SUBJECTS.filter(isUnlockedSubject);
  subjects.forEach(s => {
    const qs = subjectQuestions(s.id);
    if (qs.length >= 6) presets.push({
      id:"sub-" + s.id, title:`${subjName(s)} · ${DEVICE.lang === "bn" ? "বিষয় পরীক্ষা" : "Subject test"}`,
      subjectId:s.id, count:Math.min(10, qs.length), durationSec:Math.min(10, qs.length) * 60, tone:"blue",
      desc:DEVICE.lang === "bn" ? `${Math.min(10, qs.length)} MCQ · ${Math.min(10, qs.length)} মিনিট · সব অধ্যায়` : `${Math.min(10, qs.length)} MCQs · ${Math.min(10, qs.length)} minutes · all chapters`
    });
    s.chapters.forEach(c => {
      const cq = subjectQuestions(s.id, c.id);
      if (cq.length >= 2) presets.push({
        id:"ch-" + c.id, title:`${chapName(c)}`, subjectId:s.id, chapterId:c.id,
        count:cq.length, durationSec:Math.max(180, cq.length * 75), tone:"green",
        desc:DEVICE.lang === "bn" ? `${cq.length} MCQ · ${Math.max(3, Math.round(cq.length * 1.25))} মিনিট · ${subjName(s)}` : `${cq.length} MCQs · ${Math.max(3, Math.round(cq.length * 1.25))} minutes · ${subjName(s)}`
      });
    });
  });
  presets.push({
    id:"mock", title:DEVICE.lang === "bn" ? "মক বোর্ড পরীক্ষা" : "Mock board exam", subjectId:"mixed", chapterId:null,
    count:20, durationSec:30 * 60, tone:"violet", negative:0.25,
    desc:DEVICE.lang === "bn" ? "২০ MCQ · ৩০ মিনিট · নেগেটিভ মার্কিং" : "20 MCQs · 30 minutes · negative marking (−0.25)"
  });
  return presets;
}

}

function startExam(presetId) {
  const preset = examPresets().find(p => p.id === presetId);
  if (!preset) return;
  let pool;
  if (preset.id === "mock") pool = DB.questions.filter(q => q.status === "published");
  else if (preset.chapterId) pool = subjectQuestions(preset.subjectId, preset.chapterId);
  else pool = subjectQuestions(preset.subjectId);
  const qs = pool.slice().sort(() => Math.random() - 0.5).slice(0, preset.count);
  if (qs.length < 3) { toast(DEVICE.lang === "bn" ? "এই পরীক্ষার জন্য পর্যাপ্ত প্রশ্ন নেই।" : "Not enough questions yet for this test.", "err"); return; }
  openModal(`
    <div class="modal-head"><div class="grow">
      <span class="eyebrow">${esc(preset.negative ? "Mock board" : "Timed test")}</span>
      <h2 class="h2" style="margin-top:4px">${esc(preset.title)}</h2>
      <p class="small muted" style="margin-top:4px">${esc(preset.desc)}</p></div>
      <button class="icon-btn plain" data-action="close-modal">${icon("x", 18)}</button></div>
    <div class="modal-body">
      <div class="rules">
        ${[
          [DEVICE.lang === "bn" ? `${qs.length}টি প্রশ্ন, মোট ${qs.length} নম্বর` : `${qs.length} questions, ${qs.length} marks total`, "exam"],
          [DEVICE.lang === "bn" ? `সময় ${Math.round(preset.durationSec / 60)} মিনিট — ডিভাইস বন্ধ করলেও সময় চলবে` : `You have ${Math.round(preset.durationSec / 60)} minutes. The clock is server time and keeps running if the app closes.`, "clock"],
          [DEVICE.lang === "bn" ? "উত্তর জমা দেওয়ার আগে সঠিক উত্তর দেখা যাবে না" : "Answers and explanations stay hidden until submission.", "shield"],
          [preset.negative ? (DEVICE.lang === "bn" ? "প্রতিটি ভুল উত্তরে ০.২৫ নম্বর কাটা যাবে" : "Each wrong answer costs 0.25 marks (negative marking).") : (DEVICE.lang === "bn" ? "কোনো নেগেটিভ মার্কিং নেই" : "No negative marking for this test."), "info"],
          [DEVICE.lang === "bn" ? "যেকোনো সময় প্রশ্ন চিহ্নিত করে পরে ফিরে আসতে পারবেন" : "Flag questions and return to them from the palette at any time.", "flag"]
        ].map(r => `<div class="rule">${icon(r[1], 15)}<span>${esc(r[0])}</span></div>`).join("")}
      </div>
      <label class="checkline"><input type="checkbox" id="examAck"> ${DEVICE.lang === "bn" ? "আমি নির্দেশনা পড়েছি এবং সময় সম্পর্কে সচেতন" : "I have read the instructions and understand the timer."}</label>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" data-action="close-modal">${esc(t("cancel"))}</button>
      <button class="btn btn-primary" data-action="confirm-exam" data-preset="${preset.id}" id="examStartBtn" disabled>${esc(t("beginExam"))} ${icon("arrowRight", 15)}</button></div>
  `, { label:"Exam instructions" });
  setTimeout(() => {
    const cb = document.getElementById("examAck"), btn = document.getElementById("examStartBtn");
    if (cb && btn) cb.addEventListener("change", () => { btn.disabled = !cb.checked; });
  }, 40);
}

function viewExamRunner(attId) {
  const att = DB.examAttempts.find(a => a.id === attId && a.userId === DB.currentUserId);
  if (!att) return viewExams();
  if (att.status !== "active") return viewExamResult(attId);
  EXAMSESSION = EXAMSESSION || {};
  EXAMSESSION.attId = att.id;
  const idx = Math.min(att.current || 0, att.questionIds.length - 1);
  const q = DB.questions.find(x => x.id === att.questionIds[idx]);
  const qt = qText(q);
  const chosen = att.answers[q.id];
  const answered = att.questionIds.filter(id => att.answers[id] !== undefined).length;
  const flagged = (att.flags || []).includes(q.id);
  return {
    active:"exams",
    title:`${t("exams")} › ${att.title}`,
    body:`<div class="page">
      <div class="row wrap" style="gap:10px">
        <button class="btn btn-sm btn-ghost" data-action="exit-exam">${icon("arrowLeft", 14)} ${DEVICE.lang === "bn" ? "বন্ধ করুন" : "Leave"}</button>
        <div style="flex:1"><b style="font-size:13.5px">${esc(att.title)}</b>
          <div class="tiny faint">${DEVICE.lang === "bn" ? "সার্ভার সময় অনুযায়ী" : "Server-authoritative timer"} · ${answered}/${att.questionIds.length} ${esc(t("answered"))}</div></div>
        <span class="timer" id="examClock">${icon("clock", 14)} <span class="num">--:--</span></span>
      </div>
      <div class="exam-shell">
        <div class="card qcard">
          <div class="qmeta">
            <span class="tag blue">${DEVICE.lang === "bn" ? "প্রশ্ন" : "Question"} ${idx + 1} / ${att.questionIds.length}</span>
            ${markPill(q)}
            <button class="chip ${flagged ? "active" : ""}" data-action="flag-q" style="margin-left:auto">${icon("flag", 13)} ${flagged ? esc(t("flagged")) : esc(t("flag"))}</button>
          </div>
          <h2 class="qtext${DEVICE.lang === "bn" ? " bn" : ""}">${esc(qt.q)}</h2>

            ${qt.opts.map((opt, i) => `<button class="opt ${chosen === i ? "selected" : ""}" data-action="exam-answer" data-i="${i}">
              <span class="key">${"ABCD"[i]}</span><span class="txt">${esc(opt)}</span>
              <span class="mark">${icon("check", 18)}</span></button>`).join("")}
          </div>
          <div class="quizfoot">
            <button class="btn btn-ghost btn-sm" data-action="exam-nav" data-dir="-1" ${idx === 0 ? "disabled" : ""}>${icon("arrowLeft", 14)} ${esc(t("previous"))}</button>
            <button class="btn btn-ghost btn-sm" data-action="exam-clear" ${chosen === undefined ? "disabled" : ""}>${DEVICE.lang === "bn" ? "মুছুন" : "Clear"}</button>
            <div class="spacer"></div>
            ${idx === att.questionIds.length - 1
              ? `<button class="btn btn-primary" data-action="exam-submit">${esc(t("submit"))} ${icon("check", 15)}</button>`
              : `<button class="btn btn-primary" data-action="exam-nav" data-dir="1">${esc(t("next"))} ${icon("arrowRight", 15)}</button>`}
          </div>
        </div>
        <div class="card card-pad" style="position:sticky;top:86px">
          <div class="eyebrow" style="margin-bottom:10px">${esc(t("questionPalette"))}</div>

            ${att.questionIds.map((qid, i) => {
              const cls = i === idx ? "current" : (att.flags || []).includes(qid) ? "flagged" : att.answers[qid] !== undefined ? "answered" : "";
              return `<button class="${cls}" data-action="exam-goto" data-i="${i}">${i + 1}</button>`;

          <div class="legend"><span><i style="background:var(--emerald)"></i>${esc(t("answered"))}</span><span><i style="background:var(--amber)"></i>${esc(t("flagged"))}</span><span><i style="background:var(--faint)"></i>${esc(t("unanswered"))}</span></div>

          <button class="btn btn-primary btn-block" style="margin-top:12px" data-action="exam-submit">${esc(t("submit"))}</button>
          <p class="tiny faint" style="margin-top:8px;text-align:center">${DEVICE.lang === "bn" ? "জমা দিলে আর পরিবর্তন করা যাবে না।" : "Submission is final and scored server-side."}</p>
        </div>
      </div>
    </div>`
  };
}

/* ---------------- mistakes + revision ---------------- */
function viewMistakes() {
  const all = myMistakes();
  const subjFilter = MISTAKE_FILTER;
  const rows = all.filter(m => !subjFilter || m.subjectId === subjFilter);
  const bySubject = {};
  all.forEach(m => { bySubject[m.subjectId] = (bySubject[m.subjectId] || 0) + 1; });
  const due = dueMistakes().length;
  const cleared = DB.mistakes.filter(m => m.userId === DB.currentUserId && m.status === "cleared").length;
  const mastery = all.length + cleared ? Math.round(cleared / Math.max(1, all.length + cleared) * 100) : 0;
  return {
    active:"mistakes",
    title:`${t("mistakes")} › ${DEVICE.lang === "bn" ? "ভুলের লাইব্রেরি" : "Mistake library"}`,
    body:`<div class="page">
      ${pageHead(t("mistakes"), DEVICE.lang === "bn" ? "আপনার প্রতিটি ভুল সংরক্ষিত থাকে — মূল প্রশ্ন, আপনার উত্তর ও ব্যাখ্যা সহ।" : "Every wrong answer is captured with the question, what you chose, and the explanation — then scheduled for review.",
        `<a class="btn btn-primary btn-sm" href="#/revision">${icon("refresh", 14)} ${esc(t("revision"))} ${due ? `<span class="tag" style="background:rgba(255,255,255,.25);color:inherit">${due}</span>` : ""}</a>`)}
      <div class="grid g4">
        ${statCard({ icon:"mistakes", label:DEVICE.lang === "bn" ? "সক্রিয় ভুল" : "Active mistakes", value:all.length, tone:"violet" })}
        ${statCard({ icon:"clock", label:t("due"), value:due, tone:"amber" })}
        ${statCard({ icon:"check", label:DEVICE.lang === "bn" ? "সমাধান হয়েছে" : "Cleared", value:cleared, tone:"green" })}

      </div>
      <div class="card">

          <thead><tr><th>${DEVICE.lang === "bn" ? "প্রশ্ন" : "Question"}</th><th>${DEVICE.lang === "bn" ? "বিষয়" : "Subject"}</th><th>${DEVICE.lang === "bn" ? "বার" : "Times"}</th><th>${DEVICE.lang === "bn" ? "পরবর্তী পুনরাবৃত্তি" : "Next review"}</th><th>${esc(t("mastery"))}</th><th></th></tr></thead>

        </div>
      </div>
    </div>`
  };
}
let MISTAKE_FILTER = "";

function viewRevision() {
  const due = dueMistakes();
  if (!REVISION) REVISION = { queue: due.map(m => m.id), index:0, revealed:false, chosen:null, correct:0, done:false };
  if (!REVISION.queue.length) {
    return {
      active:"mistakes", title:`${t("revision")}`,
      body:`<div class="page">${pageHead(t("revision"), DEVICE.lang === "bn" ? "স্পেসড রিপিটিশন তালিকা।" : "Spaced repetition, tuned to when you are about to forget.")}
        <div class="card">${emptyState("check", DEVICE.lang === "bn" ? "আজকের তালিকা খালি" : "Revision queue clear", DEVICE.lang === "bn" ? "আজ আর কিছু বাকি নেই। নতুন অনুশীলন করলে ভুলগুলো এখানে আসবে।" : "Nothing is due today. New mistakes from practice will appear here on schedule.", `<a class="btn btn-primary btn-sm" href="#/learn">${esc(t("startPractice"))}</a>`)}</div>
      </div>`
    };
  }
  if (REVISION.done) {
    return {
      active:"mistakes", title:`${t("revision")} › ${DEVICE.lang === "bn" ? "সম্পন্ন" : "Complete"}`,
      body:`<div class="page"><div class="card card-pad" style="text-align:center;padding:44px">

  }
  const m = DB.mistakes.find(x => x.id === REVISION.queue[REVISION.index]);
  const q = m ? DB.questions.find(x => x.id === m.questionId) : null;
  if (!q) { REVISION.index++; if (REVISION.index >= REVISION.queue.length) REVISION.done = true; return viewRevision(); }

  const total = REVISION.queue.length;
  return {
    active:"mistakes",
    title:`${t("revision")} › ${DEVICE.lang === "bn" ? "কার্ড" : "Card"} ${REVISION.index + 1}`,
    body:`<div class="page">

        <div style="flex:1"><b style="font-size:13px">${esc(t("revisionQueue"))}</b>
          <div class="tiny faint">${DEVICE.lang === "bn" ? "SM-2 সময়সূচি · প্রতিটি সঠিক উত্তর বিরতি বাড়ায়" : "SM-2 schedule · a correct review pushes the next date further out"}</div></div>
        <span class="tag ${m.count > 1 ? "rose" : "amber"}">${m.count}× ${DEVICE.lang === "bn" ? "ভুল" : "wrong"}</span>
        <span class="tag grey">${REVISION.index + 1}/${total}</span>
      </div>
      <div class="quizbar"><div class="bar"><i style="width:${REVISION.index / total * 100}%;background:linear-gradient(90deg,#3DDBAB,#0EA47A)"></i></div></div>
      <div class="card qcard">
        <div class="qmeta"><span class="tag green">${esc(subjName(subjectOf(q.subjectId)))}</span>${markPill(q)}
          <span class="tiny faint" style="margin-left:auto">${esc(chapName(chapterOf(q.chapterId)))}</span></div>
        <h2 class="qtext${DEVICE.lang === "bn" ? " bn" : ""}">${esc(qt.q)}</h2>
        <div class="options">
          ${qt.opts.map((opt, i) => {
            let cls = "";
            if (REVISION.revealed) cls = i === qt.ans ? "correct" : i === REVISION.chosen ? "wrong" : "dim";
            else if (i === REVISION.chosen) cls = "selected";
            return `<button class="opt ${cls}" data-action="revision-choose" data-i="${i}" ${REVISION.revealed ? "disabled" : ""}>
              <span class="key">${"ABCD"[i]}</span><span class="txt">${esc(opt)}</span>
              <span class="mark">${icon(REVISION.revealed && i === qt.ans ? "check" : "x", 18)}</span></button>`;
          }).join("")}
        </div>
        ${REVISION.revealed ? `<div class="explain"><b>${icon("sparkles", 14)} ${esc(t("explanation"))}</b><span>${esc(qt.exp)}</span></div>` : ""}
        <div class="quizfoot">
          <span class="tiny faint">${DEVICE.lang === "bn" ? "আত্মবিশ্বাসের সাথে মনে করতে পারলে সঠিক চিহ্নিত করুন।" : "Answer honestly — the schedule adapts to your recall."}</span>
          <div class="spacer"></div>
          ${REVISION.revealed
            ? `<button class="btn btn-primary" data-action="revision-next">${REVISION.index === total - 1 ? esc(t("finish")) : esc(t("next"))} ${icon("arrowRight", 15)}</button>`
            : `<button class="btn btn-primary" data-action="revision-reveal" ${REVISION.chosen === null ? "disabled" : ""}>${DEVICE.lang === "bn" ? "উত্তর যাচাই" : "Check answer"}</button>`}
        </div>
      </div>
      <p class="tiny faint" style="text-align:center">${DEVICE.lang === "bn" ? `পরবর্তী নির্ধারিত তারিখ: ${m.dueAt}` : `Currently scheduled for ${m.dueAt}`}</p>
    </div>`
  };
}

let CQ_FILTER = "";

function cqDraftKey(cqId) { return DB.currentUserId + ":" + cqId; }
function cqDraft(cqId) {
  const k = cqDraftKey(cqId);
  if (!DB.cqDrafts[k]) DB.cqDrafts[k] = { texts:{}, assess:{}, updatedAt:null };
  return DB.cqDrafts[k];
}

function viewCQList(query) {
  const filter = query && query.subject ? query.subject : CQ_FILTER;
  const rows = DB.cqs.filter(c => !filter || c.subjectId === filter);
  return {
    active:"cq",
    title:`${t("cq")}`,
    body:`<div class="page">
      ${pageHead(t("cq"), DEVICE.lang === "bn" ? "বোর্ড-ধাঁচের সৃজনশীল প্রশ্ন — ক, খ, গ, ঘ অংশ, মডেল উত্তর ও মার্কিং রুব্রিক সহ।" : "Board-style creative questions with ক–ঘ sub-questions, model answers, marking rubrics and space to write.",

        <button class="chip ${!filter ? "active" : ""}" data-action="filter-cq" data-subject="">${esc(t("allSubjects"))}</button>

          const s = subjectOf(c.subjectId);

        <p style="font-size:15.5px;line-height:1.7;font-weight:600">${esc(ct.stem)}</p>

      <div class="col" style="gap:14px">
        ${ct.parts.map((p, i) => {
          const enPart = c.en.parts[i];

          return `<div class="card card-pad">
            <div class="row" style="gap:10px;align-items:flex-start">
              <span class="qno tag blue" style="font-size:13px;padding:3px 9px">${esc(p.label)}</span>
              <p style="flex:1;font-size:13.5px;line-height:1.65">${esc(p.text)}</p>
              <span class="tag grey">${enPart.marks}</span>

              <label class="label" for="cq-${i}">${esc(t("writeAnswer"))} <span class="tiny faint" style="font-weight:500">${DEVICE.lang === "bn" ? "স্বয়ংক্রিয়ভাবে সংরক্ষিত" : "autosaved locally"}</span></label>
              <textarea class="textarea" id="cq-${i}" data-cq-input="${i}" data-cq="${c.id}" placeholder="${DEVICE.lang === "bn" ? "এখানে আপনার উত্তর লিখুন…" : "Write your answer here…"}" style="min-height:${enPart.marks >= 3 ? 120 : 84}px">${esc(val)}</textarea>

            <span class="draftstatus ${writtenCount ? "saved" : ""}">${icon("edit", 12)} ${writtenCount}/4 ${DEVICE.lang === "bn" ? "অংশ লেখা হয়েছে" : "parts written"}</span>

          <a class="btn btn-ghost btn-sm" href="#/cq">${esc(t("back"))}</a>

  let inner;

    inner = `<div class="voice"><button aria-label="${esc(t("play"))}">${icon("play", 11)}</button>
      <span class="wave">${Array.from({ length: 22 }).map((_, i) => `<i style="height:${4 + ((i * 7) % 14)}px"></i>`).join("")}</span>
      <span class="dur">${fmtDur(m.voice.dur)}</span></div>`;
  } else {
    inner = esc(m.text || "");
  }
  const readTick = mine && c.type === "dm" ? `<span style="opacity:.75">${icon("check", 10)}</span>` : "";
  return `<div class="msg ${mine ? "me" : ""}">
    ${!mine ? avatar(author, "sm") : ""}

  </div>`;
}

function viewChat(convId) {
  const convs = myConversations();
  if (!convId && convs.length) convId = convs[0].id;
  const c = convById(convId);
  if (c) { markConvRead(c); CHAT_VIEW = c.id; }
  const messages = c ? c.messages : [];
  let lastDay = "";
  const body = messages.map(m => {
    const k = new Date(m.at).toDateString();
    let sep = "";
    if (k !== lastDay) {
      lastDay = k;
      const today = new Date().toDateString() === k;
      const yest = new Date(Date.now() - 864e5).toDateString() === k;
      sep = `<div class="daysep">${today ? esc(t("today")) : yest ? esc(t("yesterday")) : new Date(m.at).toLocaleDateString("en-GB", { day:"numeric", month:"short" })}</div>`;
    }
    return sep + chatBubble(m, c);
  }).join("");

                  : avatar(o, "", o && o.priv && o.priv.online ? "online" : "")}
                <span class="meta"><span class="nm">${esc(convTitle(x))}${x.type === "group" ? `<span class="tag grey" style="font-size:8.5px">${x.members.length}</span>` : ""}</span>
                  <span class="pv">${last ? (last.voice ? "🎙 " + esc(t("voiceNote")) : esc((userById(last.from) === me() ? "You: " : "") + (last.text || ""))) : DEVICE.lang === "bn" ? "নতুন কথোপকথন" : "New conversation"}</span></span>
                <span class="side"><span class="tm">${last ? new Date(last.at).toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" }) : ""}</span>${un ? `<span class="unread">${un}</span>` : ""}</span>
              </a>`;

          </div>
          <div style="padding:10px 12px;border-top:1px solid var(--line)"><p class="tiny faint" style="line-height:1.5">${DEVICE.lang === "bn" ? "১vs১ চ্যাট রিপোর্ট করলে ৭–১০ দিনের জন্য প্রশাসক দেখতে পারেন।" : "1v1 chats are private unless reported. Group chats may be reviewed for safety."}</p></div>
        </aside>

              ${c.type === "group"

function beginMatch(subjectId, opponentId) {
  const u = me();
  const pool = subjectQuestions(subjectId).slice().sort(() => Math.random() - 0.5).slice(0, 8);
  if (pool.length < 4) { toast(DEVICE.lang === "bn" ? "এই বিষয়ে যথেষ্ট প্রশ্ন নেই।" : "Not enough questions in that subject.", "err"); return; }
  const opp = userById(opponentId) || DB.users.find(x => x.id !== u.id && x.status === "approved" && !isStaff(x));
  MATCH = {
    subjectId, opponentId:opp.id, queue:pool.map(q => q.id), index:0, scoreA:0, scoreB:0,
    startedAt:Date.now(), deadline:Date.now() + 5 * 60 * 1000, finished:false,
    botNextAt:Date.now() + 7000, botAnswered:0, chosen:null, revealed:false, answers:0
  };
  navigate("#/match");
}
function matchQuestion() { return DB.questions.find(q => q.id === MATCH.queue[MATCH.index]); }

function viewMatchLive() {
  const q = matchQuestion();
  if (!q) return viewMatchResult();
  const opp = userById(MATCH.opponentId);
  const qd = qText(q);
  const total = MATCH.queue.length;
  const left = Math.max(0, Math.floor((MATCH.deadline - Date.now()) / 1000));
  const u = me();
  return {
    active:"match",
    title:`${t("match")} › ${DEVICE.lang === "bn" ? "লাইভ" : "Live"}`,
    body:`<div class="page">
      <div class="card card-pad">
        <div class="vs">
          <div class="vs-side">${avatar(u, "lg")}<div><b style="font-size:13px;display:block">${esc(nm(u))}</b><span class="tiny faint">${DEVICE.lang === "bn" ? "আপনি" : "You"} · ${DB.ratings[u.id] || 1000} ELO</span></div></div>
          <div class="vs-mid">vs</div>
          <div class="vs-side right">${avatar(opp, "lg")}<div><b style="font-size:13px;display:block">${esc(nm(opp))}</b><span class="tiny faint">${DB.ratings[opp.id] || 1000} ELO</span></div></div>
        </div>
        <div class="row" style="gap:14px;margin-top:16px">
          <b class="num" style="font-size:22px;color:var(--blue)">${MATCH.scoreA}</b>
          <div class="duel-bar"><div class="a" style="width:${MATCH.scoreA / total * 100}%"></div><div class="b" style="width:${MATCH.scoreB / total * 100}%"></div></div>
          <b class="num" style="font-size:22px;color:var(--emerald)">${MATCH.scoreB}</b>
        </div>
        <div class="row" style="margin-top:10px;justify-content:space-between">
          <span class="tiny faint">${DEVICE.lang === "bn" ? "প্রশ্ন" : "Question"} ${MATCH.index + 1} / ${total}</span>
          <span class="timer ${left < 30 ? "crit" : left < 60 ? "warn" : ""}" style="font-size:14px">${icon("clock", 14)} <span class="num" id="matchClock">${fmtClock(left)}</span></span>
          <span class="tiny faint">${esc(subjName(subjectOf(MATCH.subjectId)))}</span>

      <div class="card qcard">
        <div class="qmeta"><span class="tag blue">${DEVICE.lang === "bn" ? "লাইভ প্রশ্ন" : "Live question"}</span>${markPill(q)}

        <div class="options">
          ${qd.opts.map((o, i) => {
            let cls = MATCH.chosen === i ? "selected" : "";
            if (MATCH.revealed) cls = i === qd.ans ? "correct" : i === MATCH.chosen ? "wrong" : "dim";
            return `<button class="opt ${cls}" data-action="match-answer" data-i="${i}" ${MATCH.revealed ? "disabled" : ""}>
              <span class="key">${"ABCD"[i]}</span><span class="txt">${esc(o)}</span>
              <span class="mark">${icon(MATCH.revealed && i === qd.ans ? "check" : "x", 18)}</span></button>`;
          }).join("")}
        </div>
        ${MATCH.revealed ? `<div class="explain"><b>${icon(MATCH.chosen === qd.ans ? "check" : "x", 14)} ${MATCH.chosen === qd.ans ? (DEVICE.lang === "bn" ? "সঠিক" : "Correct") : (DEVICE.lang === "bn" ? "সঠিক উত্তর" : "Correct answer")}: ${esc(qd.opts[qd.ans])}</b><span>${esc(qd.exp)}</span></div>` : ""}

      <div class="row" style="justify-content:center;gap:8px"><span class="tiny faint">${DEVICE.lang === "bn" ? "ম্যাচ ছেড়ে গেলে ৩০ সেকেন্ডের মধ্যে ফিরতে হবে।" : "Leaving forfeits after a 30-second reconnect grace period."}</span></div>
    </div>`
  };
}

function finishMatch() {
  if (!MATCH) return;
  // simulate opponent's remaining answers deterministically
  const remaining = MATCH.queue.length - MATCH.botAnswered;
  let bot = MATCH.scoreB;
  for (let i = 0; i < remaining; i++) if (Math.random() < 0.68) bot++;
  MATCH.scoreB = bot;
  MATCH.finished = true;
  recordMatch({ opponentId:MATCH.opponentId, subjectId:MATCH.subjectId, scoreA:MATCH.scoreA, scoreB:MATCH.scoreB, count:MATCH.queue.length });
  save(true);
  navigate("#/match");
}
function viewMatchResult() {
  const u = me();
  const opp = userById(MATCH.opponentId);
  const win = MATCH.scoreA > MATCH.scoreB, draw = MATCH.scoreA === MATCH.scoreB;
  return {
    active:"match",
    title:`${t("match")} › ${DEVICE.lang === "bn" ? "ফলাফল" : "Result"}`,
    body:`<div class="page">

        </div>

      </div>

  };
}

/* ---------------- analytics ---------------- */
function viewAnalytics() {
  const u = me();
  const st = overallStats();
  const exams = myExams().slice().sort((a, b) => a.result.at.localeCompare(b.result.at));
  const scoreSeries = exams.slice(-8);
  const labels = scoreSeries.map(e => new Date(e.result.at).toLocaleDateString("en-GB", { day:"2-digit", month:"short" }));
  const subjects = SUBJECTS.filter(isUnlockedSubject).map(s => ({ s, acc:subjectAccuracy(s.id), attempts:myAttempts().filter(a => a.subjectId === s.id).length })).filter(x => x.attempts);
  const chapters = CHAPTERS.filter(c => myAttempts().some(a => a.chapterId === c.id) || myMistakes().some(m => m.chapterId === c.id)).map(c => {
    const att = myAttempts().filter(a => a.chapterId === c.id);
    const total = att.reduce((a, b) => a + b.total, 0), correct = att.reduce((a, b) => a + b.correct, 0);
    return { c, acc: total ? Math.round(correct / total * 100) : 0, attempts: att.length, mistakes: myMistakes().filter(m => m.chapterId === c.id).length };
  }).sort((a, b) => b.attempts - a.attempts).slice(0, 6);
  const days = {};
  myAttempts().forEach(a => { const k = dayKey(a.at); days[k] = (days[k] || 0) + 1; });
  const avg = exams.length ? Math.round(exams.reduce((s, e) => s + e.result.pct, 0) / exams.length) : 0;
  const trend = exams.length >= 2 ? exams[exams.length - 1].result.pct - exams[exams.length - 2].result.pct : 0;
  return {
    active:"analytics",
    title:t("analytics"),
    body:`<div class="page">
      ${pageHead(t("analytics"), DEVICE.lang === "bn" ? "প্রতিটি সংখ্যার পিছনে কী হিসাব আছে তা এখানে স্পষ্ট।" : "Every number here is computed from your own attempts — practice and exams are counted separately.",
        `<a class="btn btn-sm btn-ghost" data-action="print">${icon("print", 14)} ${esc(t("print"))}</a>`)}
      <div class="grid g4">
        ${statCard({ icon:"exam", label:t("examsTaken"), value:st.exams, sub:`${st.attempts} ${DEVICE.lang === "bn" ? "সেশন" : "practice sets"}`, tone:"violet" })}
        ${statCard({ icon:"target", label:t("avgScore"), value:avg + "%", sub:`${trend >= 0 ? "+" : ""}${trend}% ${DEVICE.lang === "bn" ? "শেষ পরীক্ষায়" : "vs previous exam"}`, trend:Math.abs(trend) + "%", trendUp:trend >= 0, tone:"green" })}
        ${statCard({ icon:"practice", label:t("accuracy"), value:st.accuracy + "%", sub:`${st.correct}/${st.total} ${DEVICE.lang === "bn" ? "সঠিক" : "answers"}`, tone:"amber" })}
        ${statCard({ icon:"clock", label:t("studyTime"), value:Math.round(st.seconds / 60), unit:"min", sub:`${(st.seconds / Math.max(1, st.attempts) / 60).toFixed(1)} ${DEVICE.lang === "bn" ? "মিনিট/সেশন" : "min per session"}`, tone:"green" })}
      </div>

      <div class="grid g-1-2">
        <div class="card card-pad">
          <div class="row" style="justify-content:space-between;margin-bottom:12px">
            <div><div class="eyebrow">${esc(t("scoreHistory"))}</div><p class="tiny faint">${DEVICE.lang === "bn" ? "শেষ ৮টি পরীক্ষার স্কোর (%)" : "Last 8 exam scores (%) — practice is excluded"}</p></div>
            <span class="tag ${avg >= 70 ? "green" : "amber"}">${avg}%</span>
          </div>
          ${scoreSeries.length ? lineChart(scoreSeries.map(e => e.result.pct), labels, { label:"Exam score history" }) : emptyState("chart", DEVICE.lang === "bn" ? "এখনো ডেটা নেই" : "No exam data yet", DEVICE.lang === "bn" ? "একটি পরীক্ষা দিলে এখানে প্রবণতা দেখা যাবে।" : "Take an exam to unlock score trends.")}
          <div class="row" style="justify-content:space-between;margin-top:10px"><span class="tiny faint">${DEVICE.lang === "bn" ? "প্রথম" : "Oldest"}</span><span class="tiny faint">${DEVICE.lang === "bn" ? "সর্বশেষ" : "Latest"}</span></div>
        </div>
        <div class="card card-pad">
          <div class="row" style="justify-content:space-between;margin-bottom:8px">
            <div><div class="eyebrow">${esc(t("subjectPerformance"))}</div><p class="tiny faint">${DEVICE.lang === "bn" ? "বিষয়ভিত্তিক নির্ভুলতা (অনুশীলন + পরীক্ষা)" : "Accuracy by subject across practice and exams"}</p></div>
          </div>
          ${subjects.length ? barChart(subjects.map(x => ({ label:x.s.name[DEVICE.lang].split(" ")[0], value:x.acc, tone:x.acc >= 70 ? "green" : x.acc >= 45 ? "" : "amber" }))) : emptyState("chart", DEVICE.lang === "bn" ? "তথ্য নেই" : "Not enough data", "")}

let ADMIN_TAB = "overview";

function adminOverview() {
  const pending = DB.users.filter(u => u.status === "pending");
  const openReports = DB.reports.filter(r => r.status === "open");
  const overdue = openReports.filter(r => reportAgeDays(r) > 7);
  const regs = DB.users.filter(u => new Date(u.created).getTime() > Date.now() - 14 * 864e5);
  const byDay = {};
  regs.forEach(u => { const k = dayKey(u.created); byDay[k] = (byDay[k] || 0) + 1; });
  const bars = Array.from({ length: 10 }).map((_, i) => {
    const d = new Date(Date.now() - (9 - i) * 864e5);
    return { label:new Date(d).toLocaleDateString("en-GB", { day:"2-digit" }), value:byDay[dayKey(d)] || 0 };
  });
  return `<div class="grid g2">
    <div class="grid g4" style="grid-column:1/-1">
      ${statCard({ icon:"userPlus", label:DEVICE.lang === "bn" ? "অপেক্ষমাণ" : "Awaiting approval", value:pending.length, sub:DEVICE.lang === "bn" ? "এক কর্মদিবসের মধ্যে" : "review within 1 working day", tone:"amber" })}
      ${statCard({ icon:"users", label:DEVICE.lang === "bn" ? "সক্রিয় শিক্ষার্থী" : "Active students", value:DB.users.filter(u => u.status === "approved").length, tone:"green" })}
      ${statCard({ icon:"shield", label:DEVICE.lang === "bn" ? "খোলা মামলা" : "Open chat cases", value:openReports.length, sub:`${overdue.length} ${DEVICE.lang === "bn" ? "মেয়াদোত্তীর্ণ" : "overdue"}`, tone:"violet" })}
      ${statCard({ icon:"layers", label:DEVICE.lang === "bn" ? "প্রশ্ন ব্যাংক" : "Question bank", value:DB.questions.length, sub:`${DB.cqs.length} CQ · ${DB.videos.length} videos`, tone:"green" })}
    </div>
    <div class="card card-pad">
      <div class="eyebrow">${DEVICE.lang === "bn" ? "গত ১০ দিনে নিবন্ধন" : "Registrations · last 10 days"}</div>
      ${barChart(bars)}
    </div>
    <div class="col" style="gap:14px">
      <div class="card">
        <div class="card-head"><h2 class="h3">${DEVICE.lang === "bn" ? "অনুমোদনের অপেক্ষায়" : "Pending approvals"}</h2><a class="btn btn-sm btn-ghost" href="#/admin/approvals">${esc(t("viewAll"))}</a></div>
        ${pending.length ? pending.slice(0, 3).map(u => `<div class="list-item">${avatar(u, "sm")}
          <div class="meta"><b>${esc(u.name)}</b><span>@${esc(u.username)} · ${esc(t("class"))} ${u.cls} · ${timeAgo(u.created)}</span></div>
          <button class="btn btn-sm btn-primary" data-action="approve-user" data-id="${u.id}">${esc(t("approve"))}</button></div>`).join("")
          : `<div class="empty" style="padding:20px"><p class="small">${DEVICE.lang === "bn" ? "কিউ খালি।" : "Queue is clear."}</p></div>`}
      </div>
      <div class="card">
        <div class="card-head"><h2 class="h3">${DEVICE.lang === "bn" ? "মডারেশন প্রয়োজন" : "Needs moderation"}</h2><a class="btn btn-sm btn-ghost" href="#/admin/reports">${esc(t("reportsTab"))}</a></div>
        ${openReports.length ? openReports.slice(0, 2).map(r => {
          const age = reportAgeDays(r);
          return `<div class="list-item"><span class="stat-ico ${age > 7 ? "amber" : ""}">${icon("flag", 15)}</span>
            <div class="meta"><b>${esc(r.reason.slice(0, 46))}${r.reason.length > 46 ? "…" : ""}</b>
              <span>${DEVICE.lang === "bn" ? "বয়স" : "open"} ${Math.floor(age)} ${DEVICE.lang === "bn" ? "দিন" : "days"} · ${age > 7 ? esc(t("overdue")) : Math.ceil(10 - age) + " " + t("daysLeft")}</span></div>
            <button class="btn btn-sm btn-ghost" data-action="admin-open-report" data-id="${r.id}">${esc(t("resolve"))}</button></div>`;
        }).join("") : `<div class="empty" style="padding:20px"><p class="small">${DEVICE.lang === "bn" ? "কোনো খোলা মামলা নেই।" : "No open cases."}</p></div>`}
      </div>
      <div class="card">
        <div class="card-head"><h2 class="h3">${esc(t("audit"))}</h2><a class="btn btn-sm btn-ghost" href="#/admin/audit">${esc(t("viewAll"))}</a></div>
        <div class="card-pad" style="padding-top:8px">
          ${DB.audit.length ? DB.audit.slice(0, 4).map(a => `<div class="audit"><span class="dot"></span><div class="meta"><b>${esc(a.action.replace(/_/g, " "))}</b> · ${esc(a.target)}<div class="tm">${esc((userById(a.actor) || {}).name || "System")} · ${timeAgo(a.at)}</div></div></div>`).join("") : `<p class="small faint">${DEVICE.lang === "bn" ? "এখনো কোনো কার্যক্রম নেই।" : "No admin actions recorded yet."}</p>`}
        </div>
      </div>
    </div>
  </div>`;
}

      <div class="list">${rejected.map(u => `<div class="list-item">${avatar(u, "sm")}<div class="meta"><b>${esc(u.name)}</b><span>${esc(u.email)} · ${esc(u.rejectedReason || "No reason recorded")}</span></div>

        <p class="small muted">${DEVICE.lang === "bn" ? "প্রতিটি অনুমোদন ও প্রত্যাখ্যান প্রশাসকের আইডি ও সময়সহ অডিট লগে লেখা হয়। শিক্ষার্থী নিজে কখনো অনুমোদন দিতে পারে না।" : "Approvals and rejections are logged with the administrator id and timestamp. Students can never approve themselves — the client cannot write approval status."}</p></div>
    </div>
  </div>`;

  const owner = isOwner();
  const rows = DB.users.slice().sort((a, b) => {
    const rank = x => x.role === "owner" ? 0 : x.role === "admin" ? 1 : 2;
    return rank(a) - rank(b) || String(a.name || "").localeCompare(String(b.name || ""));
  });
  return `<div class="col" style="gap:14px">
    <div class="card">
      <div class="card-head"><h2 class="h3">${DEVICE.lang === "bn" ? "সব অ্যাকাউন্ট" : "Accounts & administrators"}</h2>
        <span class="tiny faint">${rows.length} ${DEVICE.lang === "bn" ? "টি অ্যাকাউন্ট" : "accounts"} · ${DB.users.filter(u => isStaff(u)).length} ${DEVICE.lang === "bn" ? "প্রশাসক" : "staff"}</span></div>
      <div class="table-wrap"><table class="table">
        <thead><tr><th>${DEVICE.lang === "bn" ? "শিক্ষার্থী" : "Account"}</th><th>${DEVICE.lang === "bn" ? "ভূমিকা" : "Role"}</th><th>${esc(t("status"))}</th><th>${esc(t("videoAccess"))}</th><th>XP</th><th></th></tr></thead>

          const roleTag = u.role === "owner" ? "violet" : u.role === "admin" ? "blue" : "grey";

          return `<tr>
          <td><div class="who">${avatar(u, "sm")}<div><b>${esc(u.name)}</b><span>@${esc(u.username)} · ${esc(t("class"))} ${u.cls}</span></div></div></td>
          <td><span class="tag ${roleTag}">${u.role === "owner" ? icon("award", 10) + " " : ""}${roleLabel}</span></td>
          <td><span class="tag ${u.status === "approved" ? "green" : u.status === "pending" ? "amber" : "rose"}">${esc(u.status)}</span></td>

            ${owner && u.role !== "owner" ? (u.role === "admin"
              ? `<button class="btn btn-sm btn-ghost" data-action="demote-admin" data-id="${u.id}">${DEVICE.lang === "bn" ? "অ্যাডমিন সরান" : "Remove admin"}</button>`

            ${u.role === "owner" ? `<span class="tiny faint">${DEVICE.lang === "bn" ? "প্রথম অ্যাকাউন্ট" : "First account"}</span>` : ""}

    </div>
    ${open.length ? open.map(r => {
      const age = reportAgeDays(r);
      const left = 10 - age;
      const reporter = userById(r.reporterId), other = userById(r.subjectId);

          <span class="deadline ${age > 7 ? "over" : left < 4 ? "warn" : "ok"}">${icon("clock", 12)} ${age > 7 ? (DEVICE.lang === "bn" ? "মেয়াদোত্তীর্ণ" : "Overdue — escalated") : `${Math.max(0, Math.ceil(left))} ${esc(t("daysLeft"))}`}</span>
          <span class="tiny faint" style="margin-left:auto">${esc(t("caseAge"))} ${timeAgo(r.createdAt)}</span>
        </div>
        <div class="row" style="gap:9px">${avatar(reporter, "sm")}<div style="flex:1"><b style="font-size:12.5px">${esc(nm(reporter))} → ${esc(nm(other))}</b>
          <div class="tiny faint">${DEVICE.lang === "bn" ? "কারণ" : "Reason"}: ${esc(r.reason)}</div></div>
          <span class="tag grey">${c ? c.messages.length : 0} ${DEVICE.lang === "bn" ? "বার্তা" : "messages"}</span></div>

          <button class="btn btn-sm btn-ghost" data-action="view-reported-chat" data-id="${r.id}">${icon("message", 14)} ${DEVICE.lang === "bn" ? "কথোপকথন দেখুন" : "Review transcript"}</button>

      <div class="table-wrap"><table class="table">

  </div>`;
}

/* ============================================================
   CHORCHA — router + interactions
   ============================================================ */
const TICKERS = [];
let CURRENT = { path:[], query:{} };

function tick(fn, ms) { const id = setInterval(fn, ms); TICKERS.push(id); return id; }
function clearTickers() { while (TICKERS.length) clearInterval(TICKERS.pop()); }

function parseHash() {
  const raw = location.hash.replace(/^#\/?/, "");
  const [pathPart, queryPart] = raw.split("?");
  const path = pathPart.split("/").filter(Boolean);
  const query = {};
  if (queryPart) queryPart.split("&").forEach(kv => { const [k, v] = kv.split("="); if (k) query[decodeURIComponent(k)] = decodeURIComponent(v || ""); });
  return { path, query };
}

function navigate(hash) {
  if (location.hash === hash) { CURRENT = parseHash(); render(); }
  else location.hash = hash;
}

function resolveView() {
  const u = me();
  if (!u) return viewAuth();
  if (u.status !== "approved" && !isStaff(u)) return viewPending();
  const { path, query } = CURRENT;
  const [root, a, b] = path;
  if (!root || root === "dashboard") return viewDashboard();
  switch (root) {
    case "learn": return viewLearn();
    case "subject": return viewSubject(a);
    case "chapter": return viewChapter(a);
    case "practice": return viewPractice(a);
    case "exams": return viewExams();
    case "exam": return viewExamRunner(a);
    case "exam-result": return viewExamResult(a);
    case "mistakes": return viewMistakes();
    case "revision": return viewRevision();
    case "cq": return a ? viewCQDetail(a) : viewCQList(query);
    case "analytics": return viewAnalytics();
    case "videos": return viewVideos();
    case "video": return viewVideo(a);
    case "match": return viewMatch();
    case "leaderboard": return viewLeaderboard();
    case "friends": return viewFriends();
    case "chat": return viewChat(a);
    case "notifications": return viewNotifications();
    case "profile": return viewProfile();
    case "settings": return viewSettings();
    case "admin": return viewAdmin(a || "overview");
    default: return viewDashboard();
  }
}

function render() {
  clearTickers();
  document.documentElement.setAttribute("data-lang", DEVICE.lang);
  document.documentElement.setAttribute("data-theme", DEVICE.theme);
  const view = resolveView();
  const root = document.getElementById("root");
  const scrollY = window.scrollY;
  if (view.bare) root.innerHTML = view.body;
  else root.innerHTML = shell(view.active, view.title, view.body);
  document.title = `${view.title.replace(/›/g, "·")} · ${APP.name}`;
  afterRender();
  if (PRACTICE && !PRACTICE.finished) {
    // practice timer display only needs occasional refresh; keep scroll stable
  }
  window.scrollTo(0, scrollY);
}

function afterRender() {
  const { path } = CURRENT;
  const [root, a] = path;
  if (root === "chat") {
    const body = document.getElementById("threadBody");
    if (body) body.scrollTop = body.scrollHeight;
    const back = document.getElementById("chatBack");
    if (back && a) back.style.display = "grid";
    if (!a) document.querySelectorAll("#chatShell").forEach(x => x.classList.add("showlist"));
  }
  if (root === "practice") startPracticeClock();
  if (root === "exam" && a) startExamClock(a);
  if (root === "match" && MATCH && !MATCH.finished) startMatchClock();
  if (root === "video" && PLAYER) startPlayerClock();
  if (REC) startRecClock();
}

/* ---------------- practice clock ---------------- */
function startPracticeClock() {
  if (!PRACTICE || PRACTICE.finished) return;
  tick(() => {
    const node = document.getElementById("practiceClock");
    if (!node || !PRACTICE || PRACTICE.finished) return;
    const secs = Math.floor((Date.now() - PRACTICE.startedAt) / 1000);
    node.innerHTML = `${icon("clock", 14)} <span class="num">${fmtClock(secs)}</span>`;
  }, 1000);
}

/* ---------------- exam clock ---------------- */
function startExamClock(attId) {
  const el = () => document.getElementById("examClock");
  const update = () => {
    const att = DB.examAttempts.find(x => x.id === attId);
    if (!att || att.status !== "active") return;
    const left = Math.max(0, Math.floor((att.deadline - Date.now()) / 1000));
    const node = el();
    if (node) {
      node.innerHTML = `${icon("clock", 14)} <span class="num">${fmtClock(left)}</span>`;
      node.className = "timer " + (left <= 30 ? "crit" : left <= 120 ? "warn" : "");
    }
    if (left <= 0) {
      submitExam(att.id);
      toast("Time is up — your answers were submitted.", "err");
      navigate(`#/exam-result/${att.id}`);
    }
  };
  update();
  tick(update, 1000);
}

/* ---------------- match clock ---------------- */
function startMatchClock() {
  tick(() => {
    if (!MATCH || MATCH.finished) return;
    const left = Math.max(0, Math.floor((MATCH.deadline - Date.now()) / 1000));
    const node = document.getElementById("matchClock");
    if (node) node.textContent = fmtClock(left);
    if (left <= 0) { finishMatch(); return; }
    if (Date.now() >= MATCH.botNextAt && MATCH.botAnswered < MATCH.queue.length) {
      MATCH.botAnswered++;
      if (Math.random() < 0.68) MATCH.scoreB++;
      MATCH.botNextAt = Date.now() + 7000 + Math.random() * 4000;
      if (MATCH.botAnswered >= MATCH.queue.length) { finishMatch(); return; }
      render();
    }
  }, 1000);
}

/* ---------------- video player clock ---------------- */
function startPlayerClock() {
  tick(() => {
    if (!PLAYER || !PLAYER.playing) return;
    const v = DB.videos.find(x => x.id === PLAYER.videoId);
    if (!v) return;
    PLAYER.position = Math.min(v.duration, PLAYER.position + 0.5 * PLAYER.rate);
    const tEl = document.getElementById("playerTime");
    const fEl = document.getElementById("seekFill");
    if (tEl) tEl.textContent = `${fmtDur(PLAYER.position)} / ${fmtDur(v.duration)}`;
    if (fEl) fEl.style.width = Math.min(100, PLAYER.position / v.duration * 100) + "%";
    if (PLAYER.position >= v.duration - 0.6) {
      PLAYER.playing = false;
      const rec = DB.videoProgress.find(p => p.userId === DB.currentUserId && p.videoId === v.id);
      const first = !rec || !rec.completed;
      if (rec) { rec.position = v.duration; rec.completed = true; rec.at = new Date().toISOString(); }
      else DB.videoProgress.push({ userId:DB.currentUserId, videoId:v.id, position:v.duration, completed:true, at:new Date().toISOString() });
      if (first) { awardXP(me(), 15, "Video lesson completed"); touchStreak(me()); toast("Lesson complete · +15 XP"); }
      v.views = (v.views || 0) + 1;
      save(true); render();
    }
  }, 500);
  tick(() => {
    if (!PLAYER) return;
    const v = DB.videos.find(x => x.id === PLAYER.videoId);
    if (!v) return;
    let rec = DB.videoProgress.find(p => p.userId === DB.currentUserId && p.videoId === v.id);
    if (!rec) { rec = { userId:DB.currentUserId, videoId:v.id, position:PLAYER.position, completed:false, at:new Date().toISOString() }; DB.videoProgress.push(rec); }
    rec.position = PLAYER.position; rec.at = new Date().toISOString();
    save();
  }, 5000);
}

/* ---------------- recording clock ---------------- */
function startRecClock() {
  tick(() => {
    const el = document.getElementById("recClock");
    if (!el || !REC) return;
    const secs = Math.floor((Date.now() - REC.startedAt) / 1000);
    el.textContent = fmtClock(secs);
    if (secs >= 60) stopRecording();
  }, 500);
}

/* ---------------- chat helpers ---------------- */
function sendChat(convId, text) {
  text = (text || "").trim();
  if (!text) return;
  sendMessage(convId, { text });
  const input = document.getElementById("chatInput");
  if (input) input.value = "";
  render();
  const box = document.getElementById("threadBody");
  if (box) box.scrollTop = box.scrollHeight;
  const c = convById(convId);
  if (c && c.type === "dm") {
    setTimeout(() => {
      if (!convById(convId)) return;
      const partner = convById(convId).members.find(id => id !== DB.currentUserId);
      const slot = document.getElementById("typingSlot");
      if (slot && CURRENT.path[1] === convId) slot.innerHTML = `<div class="typing"><i></i><i></i><i></i></div>`;
      setTimeout(() => {
        simulateReply(convId);
        if (CURRENT.path[0] === "chat" && CURRENT.path[1] === convId) {
          markConvRead(convById(convId));
          render();
          const b2 = document.getElementById("threadBody");
          if (b2) b2.scrollTop = b2.scrollHeight;
        } else save();
      }, 1400);
    }, 700);
  }
}
function stopRecording() {
  if (!REC) return;
  const dur = Math.max(1, Math.round((Date.now() - REC.startedAt) / 1000));
  const convId = REC.convId;
  REC = null;
  sendMessage(convId, { voice:{ dur } });
  render();
  toast("Voice note sent");
}

/* ---------------- global click handling ---------------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const act = el.dataset.action;
  const id = el.dataset.id;

  switch (act) {
    /* auth */
    case "auth-tab": {
      const card = document.getElementById("authCard");
      if (card) card.innerHTML = authForm(el.dataset.mode);
      break;
    }

      const u = userById(id);

      DB.currentUserId = u.id; u.lastLoginAt = new Date().toISOString(); save(true);

    case "delete-account": {
      openModal(`<div class="modal-head"><div class="grow"><h2 class="h2">Delete this account?</h2>
        <p class="small muted" style="margin-top:4px">Profile, progress, drafts and chats will be removed from this device. This cannot be undone.</p></div></div>

    case "edit-profile": {

        <button class="icon-btn plain" data-action="close-modal">${icon("x", 18)}</button></div>
        <div class="modal-body">
          <div class="field"><label class="label">${esc(t("displayName"))}</label><input class="input" id="editName" value="${esc(u.name)}" maxlength="42"></div>

    case "save-profile": {

    /* search */

    /* practice */
    case "choose-opt": {

    }
    case "reveal": {
      if (!PRACTICE || PRACTICE.chosen === null) break;
      const q = practiceQuestion(); const qt = qText(q);
      const correct = PRACTICE.chosen === qt.ans;
      PRACTICE.revealed = true;
      PRACTICE.answers = PRACTICE.answers.filter(a => a.questionId !== q.id);
      PRACTICE.answers.push({ questionId:q.id, chosen:PRACTICE.chosen, correct });
      render(); break;
    }
    case "next-q": {
      if (!PRACTICE) break;
      if (PRACTICE.index >= PRACTICE.queue.length - 1) {
        PRACTICE.finished = true;
        const secs = Math.round((Date.now() - PRACTICE.startedAt) / 1000);
        recordPractice({ subjectId:PRACTICE.subjectId, chapterId:PRACTICE.chapterId, answers:PRACTICE.answers, total:PRACTICE.queue.length, seconds:secs });
        toast(`Practice recorded · +${PRACTICE.answers.filter(a => a.correct).length * 8 + 5} XP`);
        render();
      } else {
        PRACTICE.index++; PRACTICE.chosen = null; PRACTICE.revealed = false; render();
      }
      break;
    }
    case "prev-q": {
      if (!PRACTICE || PRACTICE.index === 0) break;
      PRACTICE.index--;
      const q = practiceQuestion();
      const prev = PRACTICE.answers.find(a => a.questionId === q.id);
      PRACTICE.chosen = prev ? prev.chosen : null;
      PRACTICE.revealed = !!prev;
      render(); break;
    }
    case "hint": {
      const q = practiceQuestion();
      if (!PRACTICE.hints.includes(q.id)) PRACTICE.hints.push(q.id);
      render(); break;
    }
    case "bookmark-q": {
      const i = DB.bookmarks.indexOf(id);
      if (i >= 0) DB.bookmarks.splice(i, 1); else DB.bookmarks.push(id);
      save(); render(); break;
    }
    case "retry-practice": {
      const ch = PRACTICE.chapterId;
      PRACTICE = null; startPractice(ch); render(); break;
    }
    case "mixed-practice": {
      const sid = el.dataset.subject;
      const ids = subjectQuestions(sid).map(q => q.id);
      PRACTICE = null;
      if (!startPractice(null, { subjectId:sid, questionIds:ids, mode:"mixed", title:subjName(subjectOf(sid)) + " · Mixed" })) break;
      navigate(`#/practice/${PRACTICE.chapterId}`);
      break;
    }
    case "practice-one": {
      const q = DB.questions.find(x => x.id === id);
      if (!q) break;
      PRACTICE = null;
      startPractice(q.chapterId, { questionIds:[q.id], mode:"mistakes" });
      navigate(`#/practice/${q.chapterId}`);
      break;
    }
    case "practice-mistakes": {
      const subj = el.dataset.subject;
      let items = myMistakes();
      if (subj) items = items.filter(m => m.subjectId === subj);
      if (!items.length) { toast("No active mistakes to practise.", "err"); break; }
      const ids = items.map(m => m.questionId);
      const q = DB.questions.find(x => x.id === ids[0]);
      PRACTICE = null;
      if (!startPractice(q.chapterId, { questionIds:ids, mode:"mistakes", title:"Mistake practice", shuffle:false })) break;
      navigate(`#/practice/${q.chapterId}`);
      break;
    }
    case "filter-mistakes": MISTAKE_FILTER = el.dataset.subject; render(); break;

    /* revision */
    case "revision-choose": {
      if (!REVISION || REVISION.revealed) break;
      REVISION.chosen = Number(el.dataset.i); render(); break;
    }
    case "revision-reveal": {
      const m = DB.mistakes.find(x => x.id === REVISION.queue[REVISION.index]);
      const q = DB.questions.find(x => x.id === m.questionId);
      const correct = REVISION.chosen === qText(q).ans;
      REVISION.revealed = true;
      if (correct) REVISION.correct++;
      reviewMistake(m.id, correct ? 4 : 2);
      if (q && DB.mistakes.find(x => x.id === m.id)?.status === "cleared") toast("Mistake cleared · +10 XP");
      render(); break;
    }
    case "revision-next": {
      if (REVISION.index >= REVISION.queue.length - 1) {
        REVISION.done = true;
        awardXP(me(), 15, "Revision session"); touchStreak(me()); save(true);
      } else { REVISION.index++; REVISION.chosen = null; REVISION.revealed = false; }
      render(); break;
    }

    /* exams */
    case "start-exam": startExam(el.dataset.preset); break;
    case "confirm-exam": {
      const presetId = el.dataset.preset;
      const preset = examPresets().find(p => p.id === presetId);
      if (!preset) break;
      let pool = preset.id === "mock" ? DB.questions.filter(q => q.status === "published")
        : preset.chapterId ? subjectQuestions(preset.subjectId, preset.chapterId)
        : subjectQuestions(preset.subjectId);
      let qs = pool.slice().sort(() => Math.random() - 0.5).slice(0, preset.count);
      const att = createExamAttempt({ title:preset.title, subjectId:preset.subjectId, chapterId:preset.chapterId, questionIds:qs.map(q => q.id), durationSec:preset.durationSec, negative:preset.negative || 0 });
      closeModal();
      navigate(`#/exam/${att.id}`);
      break;
    }
    case "exam-answer": {
      const att = DB.examAttempts.find(x => x.status === "active" && x.userId === DB.currentUserId);
      if (!att) break;
      const qid = att.questionIds[att.current || 0];
      att.answers[qid] = Number(el.dataset.i);
      save(); render(); break;
    }
    case "exam-nav": {
      const att = DB.examAttempts.find(x => x.status === "active" && x.userId === DB.currentUserId);
      if (!att) break;
      att.current = Math.max(0, Math.min(att.questionIds.length - 1, (att.current || 0) + Number(el.dataset.dir)));
      save(); render(); break;
    }
    case "exam-goto": {
      const att = DB.examAttempts.find(x => x.status === "active" && x.userId === DB.currentUserId);
      if (!att) break;
      att.current = Number(el.dataset.i); save(); render(); break;
    }
    case "flag-q": {
      const att = DB.examAttempts.find(x => x.status === "active" && x.userId === DB.currentUserId);
      if (!att) break;
      const qid = att.questionIds[att.current || 0];
      att.flags = att.flags || [];
      const i = att.flags.indexOf(qid);
      if (i >= 0) att.flags.splice(i, 1); else att.flags.push(qid);
      save(); render(); break;
    }
    case "exam-clear": {
      const att = DB.examAttempts.find(x => x.status === "active" && x.userId === DB.currentUserId);
      if (!att) break;
      delete att.answers[att.questionIds[att.current || 0]]; save(); render(); break;
    }
    case "exam-submit": {
      const att = DB.examAttempts.find(x => x.status === "active" && x.userId === DB.currentUserId);
      if (!att) break;
      const answered = att.questionIds.filter(qid => att.answers[qid] !== undefined).length;
      openModal(`<div class="modal-head"><div class="grow"><h2 class="h2">Submit exam?</h2>
        <p class="small muted" style="margin-top:4px">${esc(att.title)}</p></div></div>
        <div class="modal-body"><div class="grid g2">
          <div class="card card-pad" style="box-shadow:none;background:var(--surface-2)"><div class="eyebrow">${esc(t("answered"))}</div><b class="num" style="font-size:21px">${answered}/${att.questionIds.length}</b></div>
          <div class="card card-pad" style="box-shadow:none;background:var(--surface-2)"><div class="eyebrow">${esc(t("unanswered"))}</div><b class="num" style="font-size:21px">${att.questionIds.length - answered}</b></div>
        </div><p class="small muted">Answers are scored server-side; this action cannot be undone.</p></div>
        <div class="modal-foot"><button class="btn btn-ghost" data-action="close-modal">${esc(t("cancel"))}</button>
          <button class="btn btn-primary" data-action="confirm-submit-exam" data-id="${att.id}">${esc(t("submit"))}</button></div>`, { label:"Submit exam" });
      break;
    }
    case "confirm-submit-exam": {
      const result = submitExam(id);
      closeModal();
      toast(`Submitted · ${result ? result.score + "/" + result.max : "scored"}`);
      navigate(`#/exam-result/${id}`);
      break;
    }
    case "exit-exam": {
      openModal(`<div class="modal-head"><div class="grow"><h2 class="h2">Leave this exam?</h2>

        <div class="modal-foot"><button class="btn btn-ghost" data-action="close-modal">${esc(t("cancel"))}</button>
        <button class="btn btn-primary" data-action="do-exit-exam">${DEVICE.lang === "bn" ? "বেরিয়ে যান" : "Leave exam"}</button></div>`, { label:"Leave exam" });
      break;
    }
    case "do-exit-exam": closeModal(); navigate("#/exams"); break;

      openModal(`<div class="modal-head"><div class="grow"><h2 class="h2">Clear this draft?</h2><p class="small muted">Your written answers and self-assessment marks will be removed.</p></div></div>
        <div class="modal-foot"><button class="btn btn-ghost" data-action="close-modal">${esc(t("cancel"))}</button>
        <button class="btn btn-danger" data-action="confirm-clear-cq" data-id="${el.dataset.cq}">${esc(t("save"))}</button></div>`, { label:"Clear draft" });
      break;
    }
    case "confirm-clear-cq": {
      delete DB.cqDrafts[cqDraftKey(el.dataset.id)]; save(true); closeModal(); render(); toast("Draft cleared");
      break;
    }

    /* friends */
    case "search-friends": {
      FRIEND_QUERY = (document.getElementById("friendSearch") || {}).value || "";
      render();
      break;
    }
    case "add-friend": {
      const res = sendFriendRequest(id);
      if (res && res.error) toast(res.error, "err"); else { toast("Friend request sent"); }
      render(); break;
    }
    case "accept-req": {
      let req = DB.friendRequests.find(r => r.id === id);

      if (req) { respondRequest(req.id, true); toast("Friend request accepted"); }

    }
    case "new-dm": {
      const fs = friendsOf(DB.currentUserId).map(userById).filter(Boolean);
      openModal(`<div class="modal-head"><div class="grow"><h2 class="h2">New message</h2><p class="small muted" style="margin-top:4px">Private 1v1 conversations stay between two people.</p></div>
        <button class="icon-btn plain" data-action="close-modal">${icon("x", 18)}</button></div>
        <div class="modal-body"><div class="col" style="gap:4px">
          ${fs.map(f => `<button class="list-item" style="border:1px solid var(--line);border-radius:11px;margin-bottom:5px" data-action="open-dm" data-id="${f.id}">
            ${avatar(f, "sm")}<div class="meta"><b>${esc(f.name)}</b><span>@${esc(f.username)}</span></div>${icon("chevronRight", 14, "chev")}</button>`).join("") || `<p class="small muted">Add friends first to start a private chat.</p>`}
        </div></div>`, { label:"New message" });
      break;
    }
    case "new-group": {
      const fs = friendsOf(DB.currentUserId).map(userById).filter(Boolean);
      openModal(`<div class="modal-head"><div class="grow"><h2 class="h2">${esc(t("createGroup"))}</h2>
        <p class="small muted" style="margin-top:4px">Groups need at least 3 participants. Per policy, group conversations may be reviewed by administrators.</p></div>
